<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de factura | Facturación 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="factura-imprimir.css">
    <!-- Icono que aparece en la pestaña del navegador. -->
    <link rel="icon" href="./img/fav.ico" type="image/x-icon">
    <script src="factura-imprimir.js" defer></script>
</head>
<body>
    <div class="acciones-visor container py-3 d-flex flex-wrap gap-2 justify-content-between">
        <a href="facturas.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <a id="botonEditarBorrador" class="btn btn-outline-primary d-none">Editar borrador</a>
        <button id="botonImprimir" type="button" class="btn btn-primary" disabled>
            <i class="bi bi-printer"></i> Imprimir / Guardar PDF
        </button>
    </div>

    <main id="documentoFactura" class="documento-factura container mb-5" aria-busy="true">
        <div id="estadoVisor" class="alert alert-info">Cargando factura...</div>

        <div id="contenidoFactura" class="d-none">
            <header class="cabecera-factura align-items-center">
    <div class="d-flex align-items-center gap-3">
        <img id="logoEmisor" src="/emisor/logo" alt="Logo emisor" class="logo-emisor" style="height: 100px; width: auto; max-height: 100px;" onerror="this.style.display='none'">
        <div>
            <h1 id="nombreEmisorCabecera" class="h4 mb-0 text-primary">Facturación 360</h1>
            <p class="mb-0 text-muted small">Documento de factura</p>
        </div>
    </div>
    <div class="text-end">
        <h2 id="numeroFactura" class="h5 mb-1"></h2>
        <p id="fechaFactura" class="mb-0 small"></p>
        <p id="estadoFactura" class="mb-0 small text-muted"></p>
    </div>
</header>

<div class="datos-partes mb-4">
    <div class="row">
        <div class="col-6 border-end">
            <section aria-labelledby="tituloEmisor">
                <h2 id="tituloEmisor" class="h6 fw-bold border-bottom pb-2 mb-2">Emisor</h2>
                <p id="nombreEmisor" class="fw-bold mb-1"></p>
                <p id="cifEmisor" class="mb-1"></p>
                <p id="direccionEmisor" class="mb-1"></p>
                <p id="contactoEmisor" class="mb-0"></p>
            </section>
        </div>
        <div class="col-6">
            <section class="ps-2" aria-labelledby="tituloCliente">
                <h2 id="tituloCliente" class="h6 fw-bold border-bottom pb-2 mb-2">Cliente</h2>
                <p id="nombreCliente" class="fw-bold mb-1"></p>
                <p id="nifCliente" class="mb-1"></p>
                <p id="direccionCliente" class="mb-1"></p>
                <p id="contactoCliente" class="mb-0"></p>
            </section>
        </div>
    </div>
</div>

            <section aria-labelledby="tituloConceptos">
                <h2 id="tituloConceptos" class="h5">Conceptos</h2>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Descripción</th>
                                <th scope="col" class="text-end">Cantidad</th>
                                <th scope="col" class="text-end">Precio</th>
                                <th scope="col" class="text-end">Dto.</th>
                                <th scope="col" class="text-end">Base</th>
                                <th scope="col" class="text-end">IVA</th>
                                <th scope="col" class="text-end">Total</th>
                            </tr>
                        </thead>
                        <tbody id="tablaConceptos"></tbody>
                    </table>
                </div>
            </section>

            <div class="totales-factura ms-auto">
                <div><span>Subtotal</span><strong id="subtotalFactura"></strong></div>
                <div><span>IVA</span><strong id="ivaFactura"></strong></div>
                <div class="total-final"><span>Total</span><strong id="totalFactura"></strong></div>
            </div>

            <section id="bloqueObservaciones" class="observaciones-factura d-none" aria-labelledby="tituloObservaciones">
                <h2 id="tituloObservaciones" class="h5">Observaciones</h2>
                <p id="observacionesFactura" class="mb-0"></p>
            </section>
        </div>
    </main>
</body>
</html>
