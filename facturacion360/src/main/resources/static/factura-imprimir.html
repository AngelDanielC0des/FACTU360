<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de factura | Facturación 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="factura-imprimir.css">
    <!-- Icono que aparece en la pestaña del navegador. -->
    <link rel="icon" href="./img/fav.ico" type="image/x-icon">
    <script src="factura-imprimir.js" defer></script>
</head>
<body>
    <div class="acciones-visor container py-3 d-flex justify-content-between">
        <a href="facturas.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <button id="botonImprimir" type="button" class="btn btn-primary" disabled>
            <i class="bi bi-printer"></i> Imprimir / Guardar PDF
        </button>
    </div>

    <main id="documentoFactura" class="documento-factura container mb-5" aria-busy="true">
        <div id="estadoVisor" class="alert alert-info">Cargando factura...</div>

        <div id="contenidoFactura" class="d-none">
            <header class="cabecera-factura">
                <div>
                    <h1>Facturación 360</h1>
                    <p class="mb-0">Documento de factura</p>
                </div>
                <div class="text-end">
                    <h2 id="numeroFactura" class="h4"></h2>
                    <p id="fechaFactura" class="mb-0"></p>
                    <p id="estadoFactura" class="mb-0"></p>
                </div>
            </header>

            <section class="datos-cliente" aria-labelledby="tituloCliente">
                <h2 id="tituloCliente" class="h5">Cliente</h2>
                <p id="nombreCliente" class="fw-bold mb-1"></p>
                <p id="nifCliente" class="mb-1"></p>
                <p id="direccionCliente" class="mb-1"></p>
                <p id="contactoCliente" class="mb-0"></p>
            </section>

            <section aria-labelledby="tituloConceptos">
                <h2 id="tituloConceptos" class="h5">Conceptos</h2>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Descripción</th>
                                <th scope="col" class="text-end">Cantidad</th>
                                <th scope="col" class="text-end">Precio</th>
                                <th scope="col" class="text-end">Dto.</th>
                                <th scope="col" class="text-end">Base</th>
                                <th scope="col" class="text-end">IVA</th>
                                <th scope="col" class="text-end">Total</th>
                            </tr>
                        </thead>
                        <tbody id="tablaConceptos"></tbody>
                    </table>
                </div>
            </section>

            <div class="totales-factura ms-auto">
                <div><span>Subtotal</span><strong id="subtotalFactura"></strong></div>
                <div><span>IVA</span><strong id="ivaFactura"></strong></div>
                <div class="total-final"><span>Total</span><strong id="totalFactura"></strong></div>
            </div>

            <section id="bloqueObservaciones" class="observaciones-factura d-none" aria-labelledby="tituloObservaciones">
                <h2 id="tituloObservaciones" class="h5">Observaciones</h2>
                <p id="observacionesFactura" class="mb-0"></p>
            </section>
        </div>
    </main>
</body>
</html>
