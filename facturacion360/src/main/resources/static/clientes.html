<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Portal de Clientes | Facturación 360
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
        rel="icon"
        href="./img/fav.ico"
        type="image/png">



    <script src="clientes.js" defer></script>

</head>


<body>



<!-- =========================================================
     NAVBAR
========================================================= -->


<div id="pantalla-carga" class="pantalla-carga d-none">
    <img src="img/KittyLoading.gif" alt="Cargando..." class="spinner-carga">
</div>


<nav class="navbar">

    <div class="container">

        <a
            class="navbar-brand" href="index.html">

            <img src="./img/finanzas.png" alt="Logo de Facturación 360" class="logo me-2">

            Facturación 360

        </a>


        <ul class="navbar-nav">

            <li><a class="nav-link" href="index.html">Inicio</a></li>
			<li><a class="nav-link" href="perfil.html">Datos Emisor</a></li>
            <li><a class="nav-link active" href="clientes.html" >Clientes</a> </li>
           <li><a class="nav-link" href="facturas.html"> Facturas</a></li>

        </ul>

    </div>

</nav>


<!-- =========================================================
     CONTENIDO PRINCIPAL
========================================================= -->

<main class="container py-5">


    <!-- CABECERA -->

    <div
        class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            Panel de Gestión de Clientes
        </h2>


        <button
            class="btn btn-primary-custom"
            data-bs-toggle="modal"
            data-bs-target="#clienteModal">

            Añadir Cliente

        </button>

    </div>


    <!-- =====================================================
         FILTROS
    ====================================================== -->

    <div class="barra-filtros mb-4">


        <!-- BUSCADOR -->

        <div class="buscador-clientes">

            <i
                class="fa-solid fa-magnifying-glass buscador-icono"
                aria-hidden="true">
            </i>


            <input
                type="search"
                id="buscador-clientes"
                class="buscador-input"
                placeholder="Buscar por nombre o CIF..."
                aria-label="Buscar cliente por nombre o CIF">

        </div>


        <!-- PROVINCIA -->

        <div
            class="input-group input-group-sm control-filtro">

            <span
                class="input-group-text"
                aria-hidden="true">

                <i
                    class="fa-solid fa-map-location-dot">
                </i>

            </span>


            <select
                id="filtro-provincia"
                class="form-select"
                aria-label="Filtrar por provincia">

                <option value="">
                    Todas las provincias
                </option>

            </select>

        </div>


        <!-- POBLACIÓN -->

        <div
            class="input-group input-group-sm control-filtro">

            <span
                class="input-group-text"
                aria-hidden="true">

                <i
                    class="fa-solid fa-city">
                </i>

            </span>


            <select
                id="filtro-poblacion"
                class="form-select"
                aria-label="Filtrar por población">

                <option value="">
                    Todas las poblaciones
                </option>

            </select>

        </div>


        <!-- ORDENACIÓN -->

        <div
            class="input-group input-group-sm control-orden">


            <span
                class="input-group-text"
                aria-hidden="true">

                <i
                    class="fa-solid fa-arrow-down-short-wide">
                </i>

            </span>


            <select
                id="filtro-ordenar-por"
                class="form-select"
                aria-label="Ordenar por">

                <option value="fecha_alta">
                    Fecha de alta
                </option>

                <option value="nombre">
                    Nombre
                </option>

            </select>


            <button
                id="btn-direccion"
                type="button"
                class="btn btn-outline-secondary btn-direccion">

                <i
                    id="icono-direccion"
                    class="fa-solid fa-arrow-down-wide-short"
                    aria-hidden="true">
                </i>

                <span id="etiqueta-direccion">
                    Más recientes
                </span>

            </button>

        </div>


        <!-- LIMPIAR -->

        <button
            id="btn-limpiar"
            type="button"
            class="btn btn-sm btn-link btn-limpiar">

            <i
                class="fa-solid fa-eraser"
                aria-hidden="true">
            </i>

            Limpiar

        </button>

    </div>


    <!-- =====================================================
         TABLA
    ====================================================== -->

    <div class="table-responsive">

        <table
            class="table table-striped table-hover align-middle">


            <thead class="table-primary-custom">

                <tr>


                    <!-- NOMBRE -->

                    <th
                        scope="col"
                        aria-sort="none">

                        <button
                            type="button"
                            class="th-ordenable"
                            data-columna="nombre">

                            Nombre

                            <i
                                class="fa-solid fa-sort caret-orden"
                                aria-hidden="true">
                            </i>

                        </button>

                    </th>


                    <!-- CIF -->

                    <th scope="col">
                        CIF
                    </th>


                    <!-- EMAIL -->

                    <th scope="col">
                        Email
                    </th>


                    <!-- TELÉFONO -->

                    <th scope="col">
                        Teléfono
                    </th>


                    <!-- FECHA -->

                    <th
                        scope="col"
                        aria-sort="descending">

                        <button
                            type="button"
                            class="th-ordenable"
                            data-columna="fecha_alta">

                            Alta

                            <i
                                class="fa-solid fa-sort caret-orden"
                                aria-hidden="true">
                            </i>

                        </button>

                    </th>


                    <!-- ACCIONES -->

                    <th
                        scope="col"
                        class="text-end">

                        Acciones

                    </th>

                </tr>

            </thead>


            <!-- Las filas las genera clientes.js -->

            <tbody
                id="tabla-clientes">
            </tbody>


        </table>

    </div>


    <!-- =====================================================
         PAGINACIÓN
    ====================================================== -->

    <nav
        aria-label="Paginación de clientes"
        class="d-flex justify-content-between align-items-center mt-3">


        <button
            id="btn-anterior"
            type="button"
            class="btn btn-outline-secondary"
            disabled>

            <i
                class="fa-solid fa-chevron-left">
            </i>

            Anterior

        </button>


        <span
            id="info-pagina"
            class="text-muted"
            aria-live="polite">
        </span>


        <button
            id="btn-siguiente"
            type="button"
            class="btn btn-outline-secondary">

            Siguiente

            <i
                class="fa-solid fa-chevron-right">
            </i>

        </button>


    </nav>


    <!-- =====================================================
         TEMPLATE DE CLIENTE
    ====================================================== -->

    <template id="fila-cliente-template">

        <tr>

            <td class="cliente-nombre"></td>

            <td class="cliente-cif"></td>

            <td class="cliente-email"></td>

            <td class="cliente-telefono"></td>

            <td class="cliente-alta"></td>


            <td class="text-end">


                <!-- VER -->

                <button
                    class="btn btn-sm btn-primary-custom-table btn-ver"
                    title="Ver"
                    aria-label="Ver cliente">

                    <i
                        class="fa-solid fa-eye">
                    </i>

                </button>


                <!-- EDITAR -->

                <button
                    class="btn btn-sm btn-primary-custom-table btn-editar"
                    title="Editar"
                    aria-label="Editar cliente">

                    <i
                        class="fa-solid fa-pencil">
                    </i>

                </button>


                <!-- ELIMINAR -->

                <button
                    class="btn btn-sm text-danger btn-eliminar"
                    title="Eliminar"
                    aria-label="Eliminar cliente">

                    <i
                        class="fa-solid fa-trash">
                    </i>

                </button>


            </td>

        </tr>

    </template>


</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer
    class="bg-dark text-white py-4 mt-auto">

    <div class="container text-center">

        <p>
            &copy; 2026 Facturación 360.
            Todos los derechos reservados.
        </p>

    </div>

</footer>


<!-- =========================================================
     MODAL AÑADIR / EDITAR CLIENTE
========================================================= -->

<div
    class="modal fade"
    id="clienteModal"
    tabindex="-1"
    aria-labelledby="clienteModalLabel"
    aria-hidden="true">


    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="clienteModalLabel">

                    Gestionar Cliente

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar">
                </button>

            </div>


            <div class="modal-body">

                <form id="formCliente">


                    <div class="mb-3">

                        <label
                            for="nombreCliente"
                            class="form-label">

                            Nombre o Empresa

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="nombreCliente"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="cifCliente"
                            class="form-label">

                            CIF

                        </label>


                        <input
                            type="text"
                            class="form-control"
                            id="cifCliente"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="emailCliente"
                            class="form-label">

                            Email

                        </label>


                        <input
                            type="email"
                            class="form-control"
                            id="emailCliente"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="telefonoCliente"
                            class="form-label">

                            Teléfono

                        </label>


                        <input
                            type="tel"
                            class="form-control"
                            id="telefonoCliente"
                            required>

                    </div>


                </form>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>


                <button
                    type="button"
                    class="btn btn-primary-custom"
                    onclick="guardarCliente()">

                    Guardar Cambios

                </button>

            </div>


        </div>

    </div>

</div>


<!-- =========================================================
     MODAL CONFIRMAR ELIMINACIÓN
========================================================= -->

<div
    class="modal fade"
    id="confirmarEliminarModal"
    tabindex="-1"
    aria-labelledby="confirmarEliminarLabel"
    aria-hidden="true">


    <!-- modal-dialog-centered = CENTRADO -->

    <div
        class="modal-dialog modal-dialog-centered">


        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="confirmarEliminarLabel">

                    Confirmar eliminación

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar">
                </button>

            </div>


            <div
                class="modal-body text-center">


                <i
                    class="fa-solid fa-triangle-exclamation fa-3x text-warning mb-3">
                </i>


                <p class="mb-0">

                    ¿Estás seguro de que deseas
                    eliminar este cliente?

                </p>


            </div>


            <div
                class="modal-footer justify-content-center">


                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>


                <button
                    type="button"
                    id="btn-confirmar-eliminar"
                    class="btn btn-danger">

                    <i
                        class="fa-solid fa-trash me-1">
                    </i>

                    Eliminar

                </button>


            </div>


        </div>

    </div>

</div>


<!-- =========================================================
     MODAL MENSAJES
========================================================= -->

<div
    class="modal fade"
    id="mensajeModal"
    tabindex="-1"
    aria-labelledby="mensajeModalLabel"
    aria-hidden="true">


    <!-- CENTRADO -->

    <div
        class="modal-dialog modal-dialog-centered">


        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="mensajeModalLabel">

                    Información

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar">
                </button>

            </div>


            <div
                class="modal-body text-center">


                <i
                    class="fa-solid fa-circle-info fa-3x text-primary mb-3">
                </i>


                <p
                    id="mensaje-modal-texto"
                    class="mb-0">
                </p>


            </div>


            <div
                class="modal-footer justify-content-center">


                <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-dismiss="modal">

                    Aceptar

                </button>


            </div>


        </div>

    </div>

</div>


<!-- =========================================================
     BOOTSTRAP JS
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
