<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Facturas | Facturación 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <!-- Icono que aparece en la pestaña del navegador. -->
    <link rel="icon" href="./img/fav.ico" type="image/x-icon">
    <script src="facturas.js" defer></script>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <img src="./img/finanzas.png" alt="Logo de Facturación 360" class="logo me-2">
            Facturación 360
        </a>
        <ul class="navbar-nav">
            <li><a class="nav-link" href="index.html">Inicio</a></li>
            <li><a class="nav-link" href="clientes.html">Clientes</a></li>
            <li><a class="nav-link active" href="facturas.html">Facturas</a></li>
        </ul>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Panel de Gestión de Facturas</h2>
        <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#facturaModal">
            <i class="bi bi-file-earmark-plus"></i> Añadir factura
        </button>
    </div>

    <div id="mensaje-facturas" class="alert d-none" role="alert"></div>

    <div class="input-group mb-4">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" id="busquedaFactura" class="form-control"
               placeholder="Buscar por número de factura o nombre del cliente..."
               aria-label="Buscar factura">
        <button id="botonBuscar" class="btn btn-primary" type="button">Buscar</button>
        <button id="botonLimpiar" class="btn btn-outline-secondary" type="button">Limpiar</button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-primary-custom">
                <tr>
                    <th scope="col">Número</th>
                    <th scope="col">Cliente</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-end">Subtotal</th>
                    <th scope="col" class="text-end">IVA</th>
                    <th scope="col" class="text-end">Total</th>
                    <th scope="col" class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaFacturas"></tbody>
        </table>
    </div>


<footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
        <p>&copy; 2026 Facturación 360. Todos los derechos reservados.</p>
    </div>
</footer>

<div class="modal fade" id="facturaModal" tabindex="-1" aria-labelledby="facturaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="facturaModalLabel">Dar de alta una factura</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <form id="formularioFactura">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="clienteFactura" class="form-label">Cliente</label>
                            <select id="clienteFactura" class="form-select" required>
                                <option value="">Selecciona un cliente</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="numeroFactura" class="form-label">Número de factura</label>
                            <input type="text" id="numeroFactura" class="form-control" maxlength="15" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="fechaEmision" class="form-label">Fecha de emisión</label>
                            <input type="date" id="fechaEmision" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="estadoFactura" class="form-label">Estado</label>
                            <select id="estadoFactura" class="form-select" required>
                                <option value="BORRADOR">Borrador</option>
                                <option value="EMITIDA">Emitida</option>
                                <option value="PAGADA">Pagada</option>
                                <option value="ANULADA">Anulada</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="subtotalFactura" class="form-label">Subtotal</label>
                            <input type="number" id="subtotalFactura" class="form-control" min="0" step="0.01" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="ivaFactura" class="form-label">Importe IVA</label>
                            <input type="number" id="ivaFactura" class="form-control" min="0" step="0.01" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="totalFactura" class="form-label">Total</label>
                            <input type="text" id="totalFactura" class="form-control" value="0,00 €" readonly>
                        </div>
                        <div class="col-12 mb-3">
                            <label for="observacionesFactura" class="form-label">Observaciones</label>
                            <textarea id="observacionesFactura" class="form-control" maxlength="90" rows="2"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" id="botonGuardarFactura" class="btn btn-primary-custom">Guardar factura</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
>>>>>>> origin/master
</body>
</html>
